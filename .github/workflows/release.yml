name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, runner: ubuntu-latest }
          - { goos: linux, goarch: arm64, runner: ubuntu-latest }
          # macos-13 is Intel, macos-14 is Apple Silicon.
          - { goos: darwin, goarch: amd64, runner: macos-13 }
          - { goos: darwin, goarch: arm64, runner: macos-14 }
          - { goos: windows, goarch: amd64, runner: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          if [[ "$ref" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "value=${ref#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binary
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.version.outputs.value }}" \
            -o "dist/chatwoot-mcp${ext}" ./cmd/chatwoot-mcp

      - name: Package deb and rpm
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          NFPM="$(go env GOPATH)/bin/nfpm"
          export ARCH="${{ matrix.goarch }}" VERSION="${{ steps.version.outputs.value }}"
          "$NFPM" package --config packaging/nfpm.yaml --packager deb \
            --target "dist/chatwoot-mcp_${VERSION}_linux_${ARCH}.deb"
          "$NFPM" package --config packaging/nfpm.yaml --packager rpm \
            --target "dist/chatwoot-mcp-${VERSION}-1.${ARCH}.rpm"

      - name: Package dmg
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          bash packaging/macos/build-dmg.sh \
            "${{ steps.version.outputs.value }}" \
            "${{ matrix.goarch }}" \
            "dist/chatwoot-mcp" \
            "dist"

      - name: Package installer
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.value }}" `
            "/DARCH=${{ matrix.goarch }}" `
            "packaging\windows\chatwoot-mcp.iss"

      - name: Name bare binary for the release
        shell: bash
        run: |
          ext=""
          [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"
          mv "dist/chatwoot-mcp${ext}" "dist/chatwoot-mcp-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatwoot-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
