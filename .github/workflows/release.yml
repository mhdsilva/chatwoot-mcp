name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The whole build is pure Go, so one native runner per OS is enough; the
  # other architecture is cross-compiled with CGO_ENABLED=0.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Resolve version
        id: version
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          if [[ "$ref" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "value=${ref#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and package deb and rpm
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          NFPM="$(go env GOPATH)/bin/nfpm"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" -o dist/chatwoot-mcp ./cmd/chatwoot-mcp
            ARCH="$arch" "$NFPM" package --config packaging/nfpm.yaml --packager deb \
              --target "dist/chatwoot-mcp_${VERSION}_linux_${arch}.deb"
            case "$arch" in
              amd64) rpmarch=x86_64 ;;
              arm64) rpmarch=aarch64 ;;
            esac
            ARCH="$arch" "$NFPM" package --config packaging/nfpm.yaml --packager rpm \
              --target "dist/chatwoot-mcp-${VERSION}-1.${rpmarch}.rpm"
            mv dist/chatwoot-mcp "dist/chatwoot-mcp-linux-${arch}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: chatwoot-mcp-linux
          path: dist/*
          if-no-files-found: error

  darwin:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Resolve version
        id: version
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          if [[ "$ref" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "value=${ref#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and package dmg
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" -o "dist/chatwoot-mcp-darwin-${arch}" ./cmd/chatwoot-mcp
            bash packaging/macos/build-dmg.sh "${VERSION}" "$arch" "dist/chatwoot-mcp-darwin-${arch}" "dist"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: chatwoot-mcp-darwin
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Resolve version
        id: version
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          if [[ "$ref" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "value=${ref#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.version.outputs.value }}" \
            -o dist/chatwoot-mcp.exe ./cmd/chatwoot-mcp
      - name: Package installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.value }}" `
            "/DARCH=amd64" `
            "packaging\windows\chatwoot-mcp.iss"
      - name: Name bare binary
        shell: bash
        run: mv dist/chatwoot-mcp.exe dist/chatwoot-mcp-windows-amd64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: chatwoot-mcp-windows
          path: dist/*
          if-no-files-found: error

  release:
    needs: [linux, darwin, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
